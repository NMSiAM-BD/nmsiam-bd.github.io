<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>CGPA Calculator</h1>
            <p>Calculate your CGPA</p>
        </header>
        
        <div class="content-wrapper">
            <div class="card">
                <h2>Courses</h2>
                
                <div class="courses-content">
                    <table class="courses-table" id="coursesTable">
                        <thead>
                            <tr>
                                <th>Course Name</th>
                                <th>Credit</th>
                                <th>Grade Point</th>
                                <th class="action-cell">Action</th>
                            </tr>
                        </thead>
                        <tbody id="coursesTableBody">
                            <!-- Courses will be added here by JavaScript -->
                        </tbody>
                    </table>
                    
                    <div class="btn-group">
                        <button class="btn btn-add" id="addCourse">
                            <span class="icon">+</span> Add Course
                        </button>
                        <button class="btn btn-reset" id="resetAll">
                            <span class="icon">↻</span> Reset All
                        </button>
                    </div>
                    
                    <div class="checkbox-container">
                        <input type="checkbox" id="autoCalculate" checked>
                        <label for="autoCalculate">Auto-calculate as I make changes</label>
                    </div>
                </div>
            </div>
            
            <div class="card results-card">
                <h2>Calculate CGPA</h2>
                
                <div class="results-top-section">
                    <div class="cgpa-display">
                        <div class="cgpa-label">CGPA</div>
                        <div class="cgpa-value" id="cgpaValue">0.00</div>
                        <div class="out-of">Out of 4.00</div>
                        <div class="percentage" id="percentageValue">0%</div>
                    </div>
                    
                    <button class="btn btn-calculate" id="calculateBtn">
                        <span class="icon">=</span> Calculate CGPA
                    </button>
                </div>
                
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-value" id="totalCourses">3</div>
                        <div class="stat-label">Total Courses</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalCredits">0.0</div>
                        <div class="stat-label">Total Credits</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalGradePoints">0.00</div>
                        <div class="stat-label">Σ(Credit × Grade)</div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Copyright © 2026, <strong><a href="https://www.nmsiam.com.bd/" style="text-decoration: none; color: inherit;">N M SiAM</a></strong> | All rights reserved <br> Designed by <strong><a href="https://www.noormohammadsiam.com/" style="text-decoration: none; color: inherit;">Noor Mohammad Siam</a></p>
        </footer>
    </div>
      
<script src="script.js"></script>
</body>
        </html>
